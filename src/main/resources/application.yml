server:
  # Render (and most PaaS) tell the app which port to listen on.
  port: ${PORT:8080}

spring:
  application:
    name: splitter
  config:
    # Local secrets live in a git-ignored .env file; real environments set env vars instead.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/splitter}
    username: ${DB_USER:splitter}
    password: ${DB_PASSWORD:splitter}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema
    properties:
      # Loads lazy collections (e.g. expense shares on a page of expenses) in batches, avoiding N+1.
      hibernate.default_batch_fetch_size: 50
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Mail is optional (only password reset uses it); an unreachable SMTP server must
    # not mark the app DOWN and get it restarted by the platform.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
  auth:
    refresh-token-ttl: 7d
    max-failed-attempts: 5
    lockout-duration: 15m
    password-reset-ttl: 30m
  groups:
    invite-ttl: 48h
  mail:
    from: ${MAIL_FROM:no-reply@exsplit.local}
    # Public URL of this API, used to build links in emails.
    base-url: ${APP_BASE_URL:http://localhost:8080}
  scheduling:
    enabled: true
