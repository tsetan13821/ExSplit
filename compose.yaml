services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: splitter
      POSTGRES_USER: splitter
      POSTGRES_PASSWORD: splitter
    ports:
      - "5433:5432" # 5433 on the host so it never collides with a locally installed Postgres
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox
